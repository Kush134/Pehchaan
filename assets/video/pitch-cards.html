<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pehchaan · The kirana growth copilot</title>
<style>
:root{--navy:#002970;--cyan:#00baf2;--blue:#0079bd;--ink:#173451;--muted:#587991;--line:#d0e3ef}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}.stage{position:relative;width:1600px;height:900px;padding:38px 88px 170px;background:radial-gradient(ellipse at 100% 0,#dcf6ff,transparent 55%),#f6faff;isolation:isolate}.stage:before{content:'';position:absolute;inset:0;z-index:-1;background-image:linear-gradient(#d9e9f640 1px,transparent 1px),linear-gradient(90deg,#d9e9f640 1px,transparent 1px);background-size:70px 70px;mask-image:linear-gradient(90deg,transparent 35%,#000)}header{display:flex;align-items:center;justify-content:space-between;height:40px}.brand{font-size:30px;font-weight:700;letter-spacing:-1.2px;color:var(--navy)}.brand i{display:inline-block;width:8px;height:27px;background:var(--cyan);transform:skewY(-22deg);margin-right:4px}.brand i:nth-child(2){height:35px}.brand i:nth-child(3){height:19px;background:var(--navy);margin-right:15px}.track{font-size:12px;letter-spacing:1.7px;color:#647e9b;text-transform:uppercase}.content{padding-top:57px}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2.3px;text-transform:uppercase;color:var(--blue);margin:0 0 20px}h1{font-size:66px;line-height:1.08;letter-spacing:-2.8px;margin:0;color:var(--navy);font-weight:600;max-width:1300px}h1 em{font-style:normal;color:var(--blue)}.lead{font-size:24px;line-height:1.5;max-width:1180px;color:var(--muted);margin:26px 0 0}.row{display:flex;gap:24px;margin-top:35px}.tile{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px 28px;min-height:170px;box-shadow:0 8px 24px #00297004}.tile.blue{background:#e7f7ff;border-color:#9dd9f3}.tile small{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:#6789a1}.tile h2{font-size:29px;line-height:1.15;letter-spacing:-.7px;font-weight:500;margin:18px 0 13px;color:var(--navy)}.tile p{font-size:18px;line-height:1.5;color:var(--muted);margin:0}.fine{font-size:15px;line-height:1.5;color:#66849a;margin-top:23px}.strip{display:flex;gap:16px;margin-top:28px;align-items:center}.pill{padding:12px 17px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:16px;color:#416e90}.footer{position:absolute;bottom:153px;left:88px;right:88px;border-top:1px solid var(--line);padding-top:15px;display:flex;justify-content:space-between;font-size:12px;color:#6f8ba1}.footer b{font-weight:400;color:#537c99}.statement{font-size:86px;max-width:1320px;letter-spacing:-3.8px}.statement .accent{color:var(--blue)}.identity{display:grid;grid-template-columns:1.2fr 1fr;gap:45px;margin-top:27px}.identity .place{font-size:56px;line-height:1.15;color:var(--navy);letter-spacing:-1.6px;border-left:5px solid var(--cyan);padding-left:25px}.identity .place span{display:block;font-size:23px;color:#587991;letter-spacing:0;margin-top:15px}.list{display:grid;gap:16px}.list div{font-size:23px;padding-bottom:15px;border-bottom:1px solid var(--line);color:#305875}.list b{color:var(--navy)}.timeline{display:flex;align-items:center;gap:22px;margin-top:38px}.day{width:180px;background:white;border:1px solid var(--line);border-radius:12px;padding:21px;text-align:center;color:#63869e;font-size:16px}.day b{display:block;font-size:43px;color:var(--navy);margin-bottom:9px}.connector{height:2px;flex:1;background:#b8e1f2;position:relative}.connector:after{content:'';position:absolute;right:0;top:-4px;width:8px;height:8px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);transform:rotate(45deg)}.day.alert{border-color:#72cce9;background:#e4f7ff}.economic{margin-top:29px;display:grid;grid-template-columns:1.1fr 1fr;gap:25px}.amount{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px}.amount .formula{font-size:23px;color:#6488a1}.amount .value{font-size:82px;letter-spacing:-3px;color:var(--navy);margin-top:12px}.amount .unit{font-size:18px;color:#517b99;margin-top:5px}.amount.secondary{background:#e6f7ff}.time{font-size:22px;color:#517b99;margin-top:24px}.time b{color:var(--navy);font-size:30px;margin-right:18px}.market{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:32px}.market article{background:white;border:1px solid var(--line);border-radius:10px;padding:25px 23px;min-height:205px}.market h2{font-size:26px;font-weight:500;color:var(--navy);margin:0 0 21px;letter-spacing:-.5px}.market p{font-size:18px;line-height:1.55;color:#60829b;margin:0}.sources{font-size:12px;color:#7b93a9;margin-top:17px}.scope .tile{min-height:230px}.scope .num{font-size:14px;color:var(--blue);letter-spacing:2px}.scope h2{font-size:32px}.flow{display:flex;align-items:stretch;gap:12px;margin-top:44px}.flow div{background:#fff;border:1px solid var(--line);border-top:3px solid var(--cyan);border-radius:8px;flex:1;padding:25px 15px;text-align:center;font-size:23px;line-height:1.4;color:var(--navy)}.flow span{font-size:25px;color:#65abc8;align-self:center}.pilot-metric{font-size:73px;color:var(--navy);letter-spacing:-3px;margin:36px 0 25px}.pilot-metric em{font-style:normal;color:var(--blue)}.enter{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><main class="stage" id="stage"></main><script>
const frames={
pitch_intro:{eyebrow:'Track 1 · Merchant Growth AI',html:`<h1 class="statement enter d1">The neighborhood kirana’s<br><span class="accent">growth copilot.</span></h1><p class="lead enter d2">Turn repeat-customer patterns into approved, margin-aware actions.<br>Built for owners who work in Hindi or Marathi.</p><div class="strip enter d3"><span class="pill">Comeback</span><span class="pill">Voice Copilot</span><span class="pill">Haggle + guardrails</span></div>`},
pitch_customer:{eyebrow:'Chosen launch segment · Not a surveyed population',html:`<h1 class="enter d1">One owner. One kirana.<br><em>One neighborhood.</em></h1><div class="identity enter d2"><div class="place">Wakad, Pune<span>Independent, owner-operated store<br>1–3-person team · No dedicated growth analyst</span></div><div class="list"><div><b>Hindi / Marathi</b> preferred</div><div><b>QR payments</b> + recurring local households</div><div><b>Consented, usable</b> repeat-customer history</div></div></div><p class="fine enter d3">Data eligibility matters: a QR sticker alone does not guarantee customer-linked history.</p>`},
pitch_frequency:{eyebrow:'The problem hypothesis · Frequency needs field validation',html:`<h1 class="enter d1">A regular stops returning.<br><em>The counter stays busy.</em></h1><p class="lead enter d2">Designed for daily checks and weekly retention decisions.</p><div class="timeline enter d3"><div class="day"><b>5 days</b>Usual visit cadence</div><div class="connector"></div><div class="day alert"><b>20 days</b>Since last recorded visit</div><div class="connector"></div><div class="day"><b>Review</b>Confirm the signal</div></div><p class="fine enter d4">Illustrative cadence. Absence from recorded data does not prove churn or a lost sale.</p>`},
pitch_economics:{eyebrow:'Illustrative assumptions · Not measured merchant losses',html:`<h1 class="enter d1">Make the cost concrete.</h1><div class="economic enter d2"><div class="amount"><div class="formula">10 regulars × 2 missed visits × ₹300</div><div class="value" data-count="6000">₹0</div><div class="unit">monthly revenue potentially at risk</div></div><div class="amount secondary"><div class="formula">Assumed gross margin: 22%</div><div class="value" data-count="1320">₹0</div><div class="unit">gross profit potentially at risk, before offer costs</div></div></div><div class="time enter d3"><b>8h 40m / month</b>Separate time scenario: 20 minutes × 26 days.</div><p class="fine enter d4">Neither amount is a measured loss, promised saving or recoverable revenue. Validate the baseline in a pilot.</p>`},
pitch_market:{eyebrow:'Current alternatives · Documented capabilities, not a failure claim',html:`<h1 class="enter d1">Useful products already exist.</h1><div class="market enter d2"><article><h2>Paytm</h2><p>Repeat customers<br>RFM + cohorts<br>Payment-gateway analytics</p></article><article><h2>Vyapar</h2><p>Billing<br>Inventory<br>Sales reports</p></article><article><h2>Khatabook</h2><p>Digital ledger<br>Payment reminders<br>Multiple languages</p></article><article><h2>EasyRewardz</h2><p>Loyalty + segments<br>Personalised engagement<br>AI assistance</p></article></div><p class="lead enter d3">Our proposed wedge: the owner’s shortest path to an approved, affordable action.</p><div class="sources">Official sources: business.paytm.com/payment-analytics · vyaparapp.in · khatabook.com/en · easyrewardz.com/industries/consumer</div>`},
pitch_scope:{eyebrow:'A focused product · Three core capabilities',html:`<h1 class="enter d1">Three things to remember.</h1><div class="row scope"><article class="tile enter d2"><span class="num">01 / RETAIN</span><h2>Comeback</h2><p>Recognise a slowed regular.<br>Prepare an eligible offer.<br>Compare with a control.</p></article><article class="tile blue enter d3"><span class="num">02 / CONVERSE</span><h2>Voice Copilot</h2><p>Speak Hindi or Marathi.<br>Review the proposal.<br>Approve explicitly.</p></article><article class="tile enter d4"><span class="num">03 / BUY</span><h2>Haggle + guardrails</h2><p>Compare seller agents.<br>Respect financial limits.<br>Confirm a simulated order.</p></article></div><p class="fine enter d4">Shared support: customer history, catalogues, imports, experiments and audit records.</p>`},
pitch_difference:{eyebrow:'Differentiation hypothesis · Implemented workflow, unvalidated advantage',html:`<h1 class="enter d1">The difference is<br><em>the connected decision.</em></h1><div class="flow enter d2"><div>Customer<br>signal</div><span>→</span><div>Margin-eligible<br>proposal</div><span>→</span><div>Local-language<br>review</div><span>→</span><div>Explicit<br>approval</div><span>→</span><div>Measured<br>feedback</div></div><p class="lead enter d3">Language models propose. Deterministic rules validate. The owner authorises.</p><p class="fine enter d4">The pilot must test whether this workflow is easier and more valuable than existing tools.</p>`},
pitch_business:{eyebrow:'Proposed business model · Merchant value before pricing',html:`<h1 class="enter d1">A subscription tied to<br><em>a useful owner decision.</em></h1><div class="row"><article class="tile enter d2"><small>Entry</small><h2>Basic insights</h2><p>Customer signals and the next useful review.</p></article><article class="tile blue enter d3"><small>Paid workflow tier</small><h2>Growth subscription</h2><p>Advanced campaigns, voice assistance and procurement workflows.</p></article><article class="tile enter d4"><small>Value test</small><h2>Earn willingness to pay</h2><p>Compare owner time and contribution profit after offer costs.</p></article></div><p class="fine enter d4">Pricing, subscription billing and a commercial Paytm partnership remain unvalidated or unimplemented.</p>`},
pitch_pilot:{eyebrow:'Proposed validation plan · Not existing traction',html:`<h1 class="enter d1">Start narrow.<br><em>Measure honestly.</em></h1><div class="pilot-metric enter d2">10 eligible kiranas <em>×</em> 4 weeks</div><div class="strip enter d3"><span class="pill">Owner task time</span><span class="pill">Weekly return visits</span><span class="pill">Discount expense</span><span class="pill">Contribution profit</span></div><p class="lead enter d4">Consented data. A measured baseline. Appropriate controls.<br>Then test willingness to pay.</p>`},
pitch_close:{eyebrow:'Pehchaan · The kirana growth copilot',html:`<h1 class="statement enter d1">One customer signal.<br>One approved action.<br><span class="accent">A measurable next step.</span></h1><p class="lead enter d2">Help the neighborhood kirana earn the next payment.</p><div class="strip enter d3"><span class="pill">Specific customer</span><span class="pill">Focused product</span><span class="pill">Working prototype</span><span class="pill">Testable business</span></div>`}
};
window.showCard=function(id){const c=frames[id];if(!c)throw new Error('Unknown card: '+id);document.getElementById('stage').innerHTML=`<header><div class="brand"><i></i><i></i><i></i>pehchaan</div><div class="track">Track 1 · Merchant Growth AI</div></header><section class="content"><p class="eyebrow enter">${c.eyebrow}</p>${c.html}</section><footer class="footer"><span>Independent working proof of concept</span><b>Synthetic merchant records · Simulated payments · AI-generated narration</b></footer>`;const start=performance.now();const tick=()=>{const t=Math.min(1,(performance.now()-start)/2200);document.querySelectorAll('[data-count]').forEach(el=>{el.textContent='₹'+Math.round(Number(el.dataset.count)*(1-Math.pow(1-t,3))).toLocaleString('en-IN')});if(t<1)requestAnimationFrame(tick)};requestAnimationFrame(tick);return id};window.showCard('pitch_intro');
</script></body></html>
