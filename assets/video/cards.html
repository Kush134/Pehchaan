<!doctype html>
<html lang="en">
<head>

<title>Pehchaan · Walkthrough chapter cards</title>
<style>
:root{--navy:#002970;--cyan:#00baf2;--blue:#0079bd;--bg:#f5f8fc;--ink:#173451;--muted:#647d93;--border:#dce8f2;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden}.stage{position:relative;width:100vw;height:100vh;padding:50px 6.5vw 180px;isolation:isolate;background:radial-gradient(ellipse at 95% 10%,#e2f6ff,transparent 48%),#f5f8fc}.stage:before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(#b7d4e440 .7px,transparent .7px);background-size:25px 25px;mask-image:linear-gradient(90deg,transparent 35%,#000)}.top{display:flex;align-items:center;justify-content:space-between;height:48px}.brand{display:flex;align-items:center;gap:15px}.brand-name{font-size:30px;font-weight:700;letter-spacing:-1.4px;color:var(--navy)}.mark{height:39px;width:36px;position:relative}.mark i{position:absolute;width:10px;background:var(--cyan);transform:skewY(-20deg);border-radius:1px}.mark i:nth-child(1){left:0;top:12px;height:26px}.mark i:nth-child(2){left:12px;top:5px;height:27px}.mark i:nth-child(3){left:24px;top:8px;height:15px;background:var(--navy)}.track{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#6785a0}.eyebrow{font-size:14px;letter-spacing:2.4px;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 22px}.body{padding-top:65px;position:relative;max-width:1500px;margin:auto}.body h1{font-size:clamp(46px,4.2vw,76px);line-height:1.09;letter-spacing:-2.8px;font-weight:650;color:var(--navy);margin:0;max-width:1160px}.body h1 em{font-style:normal;color:var(--blue)}.lead{font-size:clamp(20px,1.55vw,28px);line-height:1.55;color:#5c7b96;max-width:1000px;margin:25px 0 0}.footer{position:absolute;bottom:155px;left:6.5vw;right:6.5vw;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#7792aa;border-top:1px solid var(--border);padding-top:16px;letter-spacing:.1px}.footer strong{color:#5b819f;font-weight:500}.progress{position:absolute;left:0;top:0;height:5px;background:var(--cyan);width:100%;transform-origin:left;animation:progress 14s linear both}.pill-row{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}.pill{border:1px solid #cce6f5;border-radius:7px;padding:11px 15px;background:#fff;color:#527c9b;font-size:14px}.intro-title{font-size:clamp(83px,9.7vw,158px)!important;letter-spacing:-7px!important}.intro-sub{font-size:clamp(28px,3vw,49px);font-weight:500;letter-spacing:-1.4px;color:var(--navy);margin:14px 0 0}.intro-line{display:flex;align-items:center;gap:20px;margin-top:32px;color:#5e84a1;font-size:21px}.intro-line:before{content:"";height:2px;width:64px;background:var(--cyan)}.question-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin-top:35px;max-width:1350px}.question{background:#fff;border:1px solid var(--border);border-radius:10px;min-height:105px;display:flex;gap:20px;align-items:flex-start;padding:25px 26px;box-shadow:0 4px 10px #17345103}.index{font-size:12px;font-weight:600;letter-spacing:1px;color:#85a9c1;background:#f1f8fd;padding:7px 8px;border-radius:5px;margin-top:2px}.question h2{font-size:25px;line-height:1.3;font-weight:500;letter-spacing:-.4px;color:#264f72;margin:0}.question p{font-size:15px;line-height:1.5;color:#7b96ac;margin:9px 0 0}.engine-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:37px}.engine{background:#fff;border:1px solid #cfe5f3;border-radius:12px;padding:27px 25px;min-height:230px;position:relative;box-shadow:0 6px 18px #12365904}.engine:before{content:"";height:3px;position:absolute;top:-1px;left:25px;right:25px;background:var(--cyan);border-radius:0 0 3px 3px}.engine:nth-child(2):before{background:#0079bd}.engine:nth-child(3):before{background:var(--navy)}.engine .category{color:#75a2bd;letter-spacing:1.3px;font-size:11px;text-transform:uppercase}.engine h2{font-size:29px;color:var(--navy);font-weight:500;letter-spacing:-.6px;margin:21px 0 14px}.engine p{font-size:17px;color:#6f8ba2;line-height:1.7;margin:0;max-width:320px}.approval{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:25px;padding:14px;border:1px solid #cee6f4;background:#eaf7fe;border-radius:7px;color:#3d82ac;font-size:16px}.approval .check{font-size:16px;width:24px;height:24px;border-radius:50%;background:#d6f0fc;display:grid;place-items:center;color:#0087bd}.arch{margin-top:34px}.arch-row{display:flex;gap:20px;align-items:center}.arch-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:23px 24px;flex:1;min-height:112px;display:flex;flex-direction:column;justify-content:center}.arch-box strong{font-size:26px;font-weight:500;letter-spacing:-.5px;color:var(--navy)}.arch-box small{font-size:14px;color:#7c99af;display:block;margin-top:10px;line-height:1.5}.arrow{height:1px;background:#9ad8ee;width:60px;position:relative;flex-shrink:0;overflow:visible}.arrow:before{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid #52b4d6;border-right:1px solid #52b4d6;transform:rotate(45deg)}.arrow:after{content:"";position:absolute;height:3px;width:14px;top:-1px;background:var(--cyan);animation:pulse 3.2s ease-in-out infinite}.arch-row.secondary{margin-top:23px;padding-top:24px;border-top:1px solid #dce9f3;gap:22px}.secondary .arch-box{background:#eef8ff;min-height:108px;border-color:#cee7f6}.secondary .arch-box strong{font-size:24px}.arch-label{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#7e9eb7;margin-bottom:12px}.usp-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 35px;margin-top:39px;max-width:1350px}.usp{display:flex;gap:17px;align-items:flex-start;padding:16px 0;border-top:1px solid #cfe1ee}.usp-dot{height:11px;width:11px;background:var(--cyan);margin-top:10px;border-radius:3px;box-shadow:0 0 0 6px #e3f6ff}.usp h2{font-size:27px;font-weight:500;letter-spacing:-.6px;color:#164c78;margin:0}.usp p{font-size:17px;line-height:1.65;color:#7391a8;max-width:460px;margin:12px 0 0}.business-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:35px}.business-tile{border:1px solid #d3e5f2;border-radius:11px;background:#fff;padding:26px;min-height:220px}.business-tile:nth-child(2){background:#eef9ff;border-color:#a9dcf3}.business-tile .step{font-size:12px;letter-spacing:1.5px;color:#7da5bf;text-transform:uppercase}.business-tile h2{font-size:28px;line-height:1.2;font-weight:500;letter-spacing:-.6px;color:var(--navy);margin:23px 0 14px}.business-tile p{font-size:17px;line-height:1.65;color:#7290a7;margin:0}.business-note{font-size:14px;color:#7291a9;margin-top:22px;text-align:center}.closing h1{font-size:clamp(49px,5.1vw,86px);line-height:1.16;letter-spacing:-3px}.closing h1 span{display:block}.closing h1 span:nth-child(2){color:#0079bd}.closing h1 span:nth-child(3){color:#00a6d9}.closing .lead{max-width:1150px;margin-top:27px;font-size:25px}.signature{margin-top:31px;display:inline-flex;gap:12px;align-items:center;font-size:15px;letter-spacing:.4px;color:#426e91}.signature i{display:block;width:43px;height:3px;background:var(--cyan)}.enter{animation:enter .85s cubic-bezier(.2,.8,.2,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.28s}.d3{animation-delay:.42s}.d4{animation-delay:.56s}.d5{animation-delay:.7s}.d6{animation-delay:.84s}@keyframes enter{from{opacity:0;transform:translateY(23px)}to{opacity:1;transform:translateY(0)}}@keyframes progress{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@keyframes pulse{0%{left:0;opacity:0}15%{opacity:1}75%{left:80%;opacity:1}100%{left:90%;opacity:0}}@media(max-height:800px){.stage{padding-top:32px}.body{padding-top:35px}.body h1{font-size:51px}.lead{font-size:21px;margin-top:18px}.question-grid,.engine-grid,.usp-grid,.business-grid{margin-top:25px}.engine{min-height:195px;padding:24px}.question{min-height:90px;padding:21px}.engine h2{font-size:24px}.engine p,.business-tile p{font-size:15px}.footer{bottom:145px}.intro-title{font-size:115px!important}.closing h1{font-size:61px}.business-tile{min-height:195px}}@media(prefers-reduced-motion:reduce){.enter,.arrow:after{animation-duration:.01ms;animation-iteration-count:1}}
</style>
</head>
<body><main id="stage" class="stage"></main>
<script>
const brand=`<div class="brand"><span class="mark"><i></i><i></i><i></i></span><span class="brand-name">pehchaan</span></div>`;
const frames={
intro:{label:'Track 1 · Merchant Growth AI',body:`<div class="eyebrow enter">The AI business partner for merchants</div><h1 class="intro-title enter d1">PEHCHAAN</h1><p class="intro-sub enter d2">Your next payment starts here.</p><div class="intro-line enter d3">Turn merchant intelligence into business action.</div><div class="pill-row enter d4"><span class="pill">Customer retention</span><span class="pill">Bulk-order negotiation</span><span class="pill">Voice-first assistance</span><span class="pill">Merchant control</span></div>`},
problem:{label:'The problem',body:`<div class="eyebrow enter">Everyday decisions. Limited time.</div><h1 class="enter d1">A merchant has data.<br>What should they do next?</h1><div class="question-grid"><div class="question enter d2"><span class="index">01</span><div><h2>Which regulars stopped returning?</h2><p>Understand visit cadence and spending changes.</p></div></div><div class="question enter d3"><span class="index">02</span><div><h2>Which offer protects my margin?</h2><p>Make retention decisions within a finite budget.</p></div></div><div class="question enter d4"><span class="index">03</span><div><h2>How do I compare a bulk order?</h2><p>Balance price, availability and delivery terms.</p></div></div><div class="question enter d5"><span class="index">04</span><div><h2>Can I manage it in my language?</h2><p>Hindi and Marathi, with an accessible text fallback.</p></div></div></div>`},
solution:{label:'The solution',body:`<div class="eyebrow enter">One merchant growth workspace</div><h1 class="enter d1">From a useful insight<br>to an approved action.</h1><div class="engine-grid"><article class="engine enter d2"><span class="category">Retention</span><h2>Comeback Engine</h2><p>Identify customer cohorts, propose eligible offers and compare experiments.</p></article><article class="engine enter d3"><span class="category">Bulk orders</span><h2>Haggle Arena</h2><p>Coordinate buyer and seller agents within budget, stock and delivery constraints.</p></article><article class="engine enter d4"><span class="category">Merchant control</span><h2>Mandate Firewall</h2><p>Enforce deterministic financial rules before consequential actions.</p></article></div><div class="approval enter d5"><span class="check">✓</span>AI proposes. Policy validates. The merchant approves.</div>`},
architecture:{label:'How it is built',body:`<div class="eyebrow enter">A working end-to-end architecture</div><h1 class="enter d1">Language understands.<br><em>Deterministic logic decides.</em></h1><div class="arch enter d2"><div class="arch-label">Application and stored data</div><div class="arch-row"><div class="arch-box"><strong>Next.js + React</strong><small>Merchant workspace and live workflow UI</small></div><span class="arrow"></span><div class="arch-box"><strong>FastAPI + Python</strong><small>Validated APIs, analytics and approvals</small></div><span class="arrow"></span><div class="arch-box"><strong>PostgreSQL + Redis</strong><small>Transactions, audit records and event distribution</small></div></div><div class="arch-row secondary"><div class="arch-box"><strong>LangGraph</strong><small>Bounded multi-agent workflow orchestration</small></div><div class="arch-box"><strong>Sarvam AI</strong><small>Language, speech and document understanding</small></div><div class="arch-box"><strong>Policy engine</strong><small>Budgets, mandates, signatures and replay checks</small></div></div></div>`},
usp:{label:'Why Pehchaan',body:`<div class="eyebrow enter">Built around merchant decisions</div><h1 class="enter d1">A copilot that connects<br>insight, action and control.</h1><div class="usp-grid"><div class="usp enter d2"><span class="usp-dot"></span><div><h2>From transactions to action</h2><p>Customer patterns lead to reviewable business proposals.</p></div></div><div class="usp enter d3"><span class="usp-dot"></span><div><h2>Voice-first assistance</h2><p>Hindi and Marathi commands become structured actions.</p></div></div><div class="usp enter d4"><span class="usp-dot"></span><div><h2>Financial guardrails</h2><p>Deterministic enforcement keeps authority outside the language model.</p></div></div><div class="usp enter d5"><span class="usp-dot"></span><div><h2>Experiments with controls</h2><p>Compare observed outcomes and label preliminary evidence.</p></div></div></div>`},
business:{label:'Proposed business model',body:`<div class="eyebrow enter">A commercialization hypothesis to validate</div><h1 class="enter d1">Start with insight.<br>Grow with merchant workflows.</h1><div class="business-grid"><article class="business-tile enter d2"><span class="step">Entry tier</span><h2>Free business insights</h2><p>Help merchants understand customer health and their next useful action.</p></article><article class="business-tile enter d3"><span class="step">Paid tools</span><h2>Growth and procurement</h2><p>Offer advanced campaign and bulk-order workflows through a subscription.</p></article><article class="business-tile enter d4"><span class="step">Future distribution</span><h2>Paytm ecosystem</h2><p>Explore authorized integration and merchant distribution partnerships.</p></article></div><p class="business-note enter d5">Proposed model · Pricing, willingness to pay and partnerships require validation.</p>`},
closing:{label:'Pehchaan · Merchant Growth AI',body:`<div class="eyebrow enter">The merchant's next growth decision</div><div class="closing"><h1 class="enter d1"><span>More returning customers.</span><span>Better negotiated deals.</span><span>Smarter merchants.</span></h1><p class="lead enter d2">Paytm helps merchants receive payments.<br>Pehchaan helps merchants earn their next payment.</p><div class="signature enter d3"><i></i>PEHCHAAN · पहचान</div></div>`}
};
window.showCard=function(id){const card=frames[id]||frames.intro;const el=document.getElementById('stage');el.dataset.card=id;el.innerHTML=`<div class="progress"></div><header class="top">${brand}<span class="track">${card.label}</span></header><section class="body">${card.body}</section><footer class="footer"><span>Independent working proof of concept</span><strong>Synthetic merchant data · Payments simulated</strong></footer>`;return{id,label:card.label};};
window.showCard('intro');
</script></body></html>
